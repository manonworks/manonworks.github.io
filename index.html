<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Manon Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Manon Works のアプリとプライバシーポリシーの案内ページです。">
<style>
/* Layout: 看板の名前とアプリの一覧だけの、1列の短いページ */
:root {
  --bg: #f4f6f1;
  --card: #ffffff;
  --ink: #20261f;
  --muted: #5c665a;
  --line: #d6ddd1;
  --accent: #2f6b4f;
  --body: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171c18; --card: #212822; --ink: #edf1ea; --muted: #a9b3a6; --line: #3a443b; --accent: #8fd0ae;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171c18; --card: #212822; --ink: #edf1ea; --muted: #a9b3a6; --line: #3a443b; --accent: #8fd0ae;
  color-scheme: dark;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.8;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px 56px;
}
main { max-width: 620px; margin: 0 auto; display: grid; gap: 32px; }
h1 { font-size: 32px; line-height: 1.3; margin: 0; letter-spacing: 0.01em; }
h2 { font-size: 18px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 15px; }
.apps { display: grid; gap: 12px; }
.app { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 4px; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mail { overflow-wrap: anywhere; user-select: all; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Manon Works</h1>
    <p class="muted">犬のまのんの名前から始まった、小さなアプリの工房です。</p>
  </header>

  <section class="apps" aria-label="アプリ">
    <div class="app">
      <h2>WanLog</h2>
      <p class="muted">散歩で会ったワンちゃんを記録する、愛犬との散歩ノート。</p>
      <p><a href="wanlog/privacy/">プライバシーポリシー</a></p>
    </div>
    <div class="app">
      <h2>なりきり日本史</h2>
      <p class="muted">歴史の人物になりきって、選びながら進む日本史の物語。公開の準備中です。</p>
      <p><a href="nihonshi/privacy/">プライバシーポリシー</a></p>
    </div>
  </section>

  <footer>
    <p class="muted">お問い合わせ: <span class="mail">manonworks.support@gmail.com</span></p>
  </footer>
</main>
</body>
</html>
